name: Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Helm Lint
        run: |
          cd charts/nginx-app
          helm lint .

      - name: Deploy com Helm
        run: |
          cd charts/nginx-app

          helm upgrade --install nginx . \
            --set message="Hello World da AsapTech - Deploy realizado via CI/CD (Commit: ${GITHUB_SHA})"